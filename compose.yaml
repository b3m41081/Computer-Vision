x-a5-service: &a5-service
  build:
    context: .
    dockerfile: Dockerfile
  image: computer-vision-a5:latest
  working_dir: /workspace
  volumes:
    - .:/workspace
  environment:
    PYTHONUNBUFFERED: "1"

services:
  extract:
    <<: *a5-service
    command: ["python", "a5/src/extract_video_frames.py"]

  colmap:
    <<: *a5-service
    command: ["python", "a5/src/run_colmap.py"]

  web:
    <<: *a5-service
    command: ["python", "a5/src/web_ui.py", "--host", "0.0.0.0", "--no-browser"]
    ports:
      - "8766:8766"
